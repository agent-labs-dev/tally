name: Check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

# Two overlapping syncs would both see an issue as missing and file it twice.
concurrency:
  group: tally-issues
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The root action: actionlint does not yet accept the `$/` self-repository form, and checkout ran just above.
      - uses: ./ # zizmor: ignore[self-repository]
