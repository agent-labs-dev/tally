name: tally
description: Track this repository's API keys by metadata and keep expiry issues in sync
inputs:
  config:
    description: Path to the tally file
    default: .tally.yaml
  org-assignee:
    description: GitHub handle assigned the issues for keys an organization owns, such as a repository variable
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - shell: bash
      run: bun "$GITHUB_ACTION_PATH/src/index.ts" issues sync
      env:
        GH_TOKEN: ${{ github.token }}
        TALLY_CONFIG: ${{ inputs.config }}
        TALLY_ORG_ASSIGNEE: ${{ inputs.org-assignee }}
